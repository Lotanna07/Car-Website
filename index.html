<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== FAVICON ===============-->
      <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

      <!--=============== REMIXICONS ===============-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">

      <!--=============== SWIPER CSS===============-->
      <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="assets/css/styles.css">

      <title>Responsive car website - Bedimcode</title>
   </head>
   <body>
      <!--==================== HEADER ====================-->
      <header class="header" id="header">
         <nav class="nav container">
            <a href="#" class="nav--logo">RaceCar</a>

            <div class="nav--menu" id="nav-menu">
               <ul class="nav--list">
                  <li>
                     <a href="#" class="nav--link">Home</a>
                  </li>

                  <li>
                     <a href="#" class="nav--link">About Us</a>
                  </li>

                  <li>
                     <a href="#" class="nav--link">Sponsors</a>
                  </li>

                  <li>
                     <a href="#" class="nav--link">TV channels</a>
                  </li>

                  <li>
                     <a href="#" class="nav--link">Contact Us</a>
                  </li>

               </ul>

               <!--close button-->
               <div class="nav--close" id="nav-close">
                  <i class="ri-close-large-line"></i>
               </div>
            </div>

            <!--Toggle button-->
            <div class="nav--toggle" id="nav-toggle">
               <i class="ri-menu-line"></i>
            </div>
         </nav>         
      </header>

      <!--==================== MAIN ====================-->
      <main class="main">
         <!--==================== HOME ====================-->
         <section class="home">
          <div class="home--swiper swiper">
            <div class="swiper-wrapper">
            <article class="home--article car--orange swiper-slide">
               <div class="home--panel-1"></div>
               <div class="home--panel-2"></div>

               <div class="home--content container">
                  <div class="home--data">
                     <div class="home--titles">
                        <h3 class="home--subtitle">Let’s</h3>
                        <h1 class="home--title">RACE</h1>
                     </div>

                     <div class="home--image">
                        <img src="assets/img/car-1.png" alt="image">
                     </div>
                  </div>
                  <div class="home--info">
                     <div class="home--specs">
                        <span>302 MPH</span>
                        <span>0 - 100 KM/H</span>
                        <span>360 KW</span>
                     </div>

                     <a href="#" class="home--button">
                        <span>Discover More</span>
                        <i class="ri-arrow-right-line"></i>
                     </a>
                  </div>
               </div>
            </article>

            <article class="home--article car__green swiper-slide">
               <div class="home--panel-1"></div>
               <div class="home--panel-2"></div>

               <div class="home--content container">
                  <div class="home--data">
                     <div class="home--titles">
                        <h3 class="home--subtitle">Let’s</h3>
                        <h1 class="home--title">RACE</h1>
                     </div>

                     <div class="home--image">
                        <img src="assets/img/car-2.png" alt="image">
                     </div>
                  </div>
                  <div class="home--info">
                     <div class="home--specs">
                        <span>302 MPH</span>
                        <span>0 - 100 KM/H</span>
                        <span>360 KW</span>
                     </div>

                     <a href="#" class="home--button">
                        <span>Discover More</span>
                        <i class="ri-arrow-right-line"></i>
                     </a>
                  </div>
               </div>
            </article>

            <article class="home--article car__blue swiper-slide">
               <div class="home--panel-1"></div>
               <div class="home--panel-2"></div>

               <div class="home--content container">
                  <div class="home--data">
                     <div class="home--titles">
                        <h3 class="home--subtitle">Let’s</h3>
                        <h1 class="home--title">RACE</h1>
                     </div>

                     <div class="home--image">
                        <img src="assets/img/car-3.png" alt="image">
                     </div>
                  </div>
                  <div class="home--info">
                     <div class="home--specs">
                        <span>302 MPH</span>
                        <span>0 - 100 KM/H</span>
                        <span>360 KW</span>
                     </div>

                     <a href="#" class="home--button">
                        <span>Discover More</span>
                        <i class="ri-arrow-right-line"></i>
                     </a>
                  </div>
               </div>
            </article>

            </div>
          </div>
         <div class="home--interaction">
         <div class="home--social">
            <div class="home--social-border"></div>

            <a href="https://twitter.com/" target="_blank"class="home--social-link">
               <i class="ri-twitter-x-line"></i>
            </a>

            <a href="https://www.instagram.com" target="_blank"class="home--social-link">
               <i class="ri-instagram-line"></i>
            </a>

            <a href="https://www.facebook.com/" target="_blank"class="home--social-link">
               <i class="ri-facebook-line"></i>
            </a>
         </div>
         <!-- pagination -->
         <div class="swiper-pagination"></div>

         </div>
         </section>
      </main>

      <!--=============== GSAP JS ===============-->
      <script src="assets/js/gsap.min.js"></script>

      <!--=============== SWIPER JS ===============-->
      <script src="assets/js/swiper-bundle.min.js"></script>
      
      <!--=============== MAIN JS ===============-->
      <script src="assets/js/main.js"></script>
   </body>
</html>
